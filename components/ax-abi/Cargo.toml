[package]
name = "ax-abi"
version = "0.1.0"
repository.workspace = true
edition.workspace = true
authors.workspace = true
description = "Umbrella crate for ArceOS personalities: pick Linux/Windows/Darwin ABIs by feature and dispatch a binary to the matching one."
keywords = ["personality", "abi", "windows", "no-std"]
categories = ["no-std", "os"]
license.workspace = true

[dependencies]
ax-binfmt = { workspace = true }
ax-abi-port = { workspace = true }
ax-abi-linux = { workspace = true, optional = true }
ax-crate-interface = { workspace = true }
ax-abi-windows = { workspace = true, optional = true }
ax-abi-darwin = { workspace = true, optional = true }
ax-abi-path = { workspace = true, optional = true }
ax-abi-driver = { workspace = true, optional = true }
ax-abi-embedded = { workspace = true, optional = true }
ax-abi-custom = { workspace = true, optional = true }

[features]
# Default wires in every personality whose crate exists today plus automatic
# magic dispatch, so a "lazy" dependant gets a working multi-personality build.
# `linux` joins the default once ax-abi-linux lands.
default = ["win", "mac", "auto-dispatch"]

# Select which syscall personalities are compiled in (one or more).
linux = ["dep:ax-abi-linux"]
win = ["dep:ax-abi-windows"]
mac = ["dep:ax-abi-darwin"]
# The embedded vector-table domain. An integrator supplies its own table, so it
# is re-exported rather than auto-registered in `personalities()`.
embedded = ["dep:ax-abi-embedded"]
# The user-extensible custom-syscall registry, opt-in to the override capability.
custom = ["dep:ax-abi-custom"]

# Route each executed image to a personality by its magic bytes.
auto-dispatch = []

# Cross-cutting compatibility shims.
driver-compat = ["dep:ax-abi-driver"]
path-compat = ["dep:ax-abi-path"]
