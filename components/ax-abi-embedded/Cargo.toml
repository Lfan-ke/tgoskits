[package]
name = "ax-abi-embedded"
version = "0.1.0"
repository.workspace = true
edition.workspace = true
authors.workspace = true
description = "Bare interrupt-vector-table personality for ArceOS: the degenerate dispatch domain, and the template for user-extensible trap handlers."
keywords = ["embedded", "vector-table", "personality", "no-std"]
categories = ["no-std", "embedded"]
license.workspace = true

[features]
# A target with an interrupt controller, which is the ordinary MCU/MPU case.
# Turn it off for a machine that only ever traps synchronously: the vector
# table then carries no asynchronous entries at all.
default = ["interrupts"]
interrupts = []

[dependencies]
ax-dispatch = { workspace = true }
ax-binfmt = { workspace = true }
