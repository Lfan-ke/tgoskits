[package]
name = "ax-abi-linux"
version = "0.1.0"
repository.workspace = true
edition.workspace = true
authors.workspace = true
description = "Linux personality for ArceOS: the Linux syscall ABI expressed against registered OS-service ports, independent of any concrete kernel runtime."
keywords = ["linux", "syscall", "personality", "no-std"]
categories = ["no-std", "os"]
license.workspace = true

[features]
# Which syscall families this personality offers, matched to the host
# capabilities they need.
default = ["fs", "mm", "task", "signal", "time", "random", "system", "creds"]
fs = ["ax-abi-port/fs"]
mm = ["ax-abi-port/mm"]
task = ["ax-abi-port/task"]
signal = ["ax-abi-port/signal"]
time = ["ax-abi-port/time"]
random = ["ax-abi-port/random"]
system = ["ax-abi-port/system"]
creds = ["ax-abi-port/creds"]

[dependencies]
ax-binfmt = { workspace = true }
ax-abi-port = { workspace = true }
ax-crate-interface = { workspace = true }
linux-raw-sys = { workspace = true, features = ["no_std", "general"] }
syscalls = { workspace = true }
