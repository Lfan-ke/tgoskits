[package]
name = "ax-abi-port"
version = "0.1.0"
description = "Capability ports an OS implements once so every ArceOS ABI personality can reach files, memory, tasks and clocks without depending on a kernel"
repository.workspace = true
edition.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["os", "no-std"]
license.workspace = true

[features]
# Each capability is a part the build can leave out. A host that has no
# filesystem drops `fs`, and the file ports stop existing at all.
default = ["fs", "mm", "task", "signal", "time", "random", "system", "creds"]
fs = []
mm = []
task = []
signal = []
time = []
random = []
system = []
creds = []

[dependencies]
ax-crate-interface = { workspace = true }
