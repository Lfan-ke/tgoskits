import numpy as np
ok = True
def chk(name, cond, info=""):
    global ok
    if cond: print("  sklearn ok %s %s" % (name, info))
    else: ok = False; print("  SKLEARN FAIL %s %s" % (name, info))
# LinearRegression on perfectly linear data y=2*x0+3*x1+5 -> OLS recovers exact coeffs.
from sklearn.linear_model import LinearRegression
X = np.array([[0,0],[1,0],[0,1],[1,1],[2,1],[1,2]],dtype=float)
y = 2*X[:,0] + 3*X[:,1] + 5
lr = LinearRegression().fit(X, y)
chk("lin_intercept", abs(lr.intercept_-5) < 1e-6, "intercept=%.6f" % lr.intercept_)
chk("lin_coef", np.allclose(lr.coef_,[2,3],atol=1e-6), "coef=%s" % lr.coef_.tolist())
chk("lin_predict", abs(float(lr.predict([[3,4]])[0]) - 23) < 1e-6, "pred(3,4)=%.4f" % lr.predict([[3,4]])[0])
# KMeans on two far-apart pure clusters -> partition is exact (label id irrelevant).
from sklearn.cluster import KMeans
P = np.array([[0,0],[0,1],[1,0],[100,100],[100,101],[101,100]],dtype=float)
labels = KMeans(n_clusters=2, n_init=10, random_state=0).fit_predict(P)
near = set(labels[:3].tolist()); far = set(labels[3:].tolist())
chk("kmeans_partition", len(near)==1 and len(far)==1 and near!=far, "labels=%s" % labels.tolist())
# LogisticRegression on linearly separable 1-D data -> predict sign is exact.
from sklearn.linear_model import LogisticRegression
Xc = np.array([[-3],[-2],[-1],[1],[2],[3]],dtype=float); yc=np.array([0,0,0,1,1,1])
clf = LogisticRegression().fit(Xc, yc)
chk("logreg", int(clf.predict([[5]])[0])==1 and int(clf.predict([[-5]])[0])==0,
    "pred(5)=%d pred(-5)=%d" % (clf.predict([[5]])[0], clf.predict([[-5]])[0]))
print("SKLEARN_OK" if ok else "SKLEARN_BAD")
EOF
$PY /tmp/t_sklearn.py > /tmp/t2.out 2>&1
