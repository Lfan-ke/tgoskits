# dnsmasq riscv64: the DNS/DHCP/TFTP carpet over loopback. prebuild.sh stages the
# dnsmasq and tftp-hpa files pinned in apk.lock and grows the rootfs to 1.5G.
args = [
    "-cpu",
    "rv64",
    "-nographic",
    "-m",
    "1024M",
    "-smp",
    "1",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-riscv64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
uefi = false
to_bin = true
fail_regex = ["(?i)\\bpanic(?:ked)?\\b", "(?m)^TEST FAILED\\s*$"]
timeout = 5400

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "/usr/bin/run-dnsmasq.sh"
success_regex = ["(?m)^TEST PASSED\\s*$"]
