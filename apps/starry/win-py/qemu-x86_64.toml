args = [
    "-nographic",
    "-m", "1024M",
    "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-x86_64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0",
    "-netdev", "user,id=net0",
]
uefi = true
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "/python/python.exe -u /suite/t16_datetime_contextlib.py"
success_regex = ['PY_DATETIME_OK|PY_DT_OK|PY_T16']
# Only the machine failing ends the run: the suite prints its own verdict, and
# t19 drives the interpreter's own error paths on purpose - a child that dies
# with "Fatal Python error" is a check passing, not the run failing.
fail_regex = ['(?i)panic']
timeout = 1500
