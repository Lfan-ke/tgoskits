[workspace]

[package]
name = "egui_layout"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "egui_layout"
path = "src/main.rs"

[dependencies]
egui = "=0.32.3"
egui_kittest = { version = "=0.32.3", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
debug = false
incremental = false
codegen-units = 16
