# cpu-gui-egui-test aarch64 - egui/eframe GUI test carpet (egui_kittest) rendering egui UIs headlessly
# through egui_wgpu on Mesa lavapipe (software Vulkan over the LLVM JIT, no surface/swapchain).
# Provisioned from Alpine edge as musl packages (mesa-vulkan-swrast + vulkan-loader), which Alpine builds
# for aarch64, so the carpet runs on-target; no host GPU. -cpu max exposes the full AArch64 feature set
# (LSE atomics, dotprod, ARMv8.2+ NEON) that lavapipe's LLVM JIT dispatches to at runtime. -smp 1: single
# vCPU, so lavapipe runs single-threaded. 4096M: the lavapipe LLVM JIT + egui/wgpu buffers are heap-heavy.
args = [
    "-nographic", "-cpu", "max", "-m", "4096M", "-smp", "1",
    "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "sh /usr/bin/run_all.sh"
success_regex = ['(?m)^TEST PASSED\s*$']
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^TEST FAILED\s*$']
timeout = 12000
