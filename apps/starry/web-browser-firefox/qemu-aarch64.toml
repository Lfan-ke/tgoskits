args = [
    "-machine",
    "virt",
    "-cpu",
    "cortex-a72",
    "-serial",
    "stdio",
    "-vnc",
    ":0",
    "-m",
    "3G",
    "-smp",
    "4",
    "-device",
    "virtio-gpu-pci,xres=1024,yres=768",
    "-device",
    "virtio-tablet-pci",
    "-device",
    "virtio-keyboard-pci",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
    "-accel", "tcg",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "/usr/bin/test-browser.sh"
success_regex = ["(?m)^WEB_BROWSER_TEST_PASSED\\s*$"]
fail_regex = [
    '(?i)\bpanic(?:ked)?\b',
    '(?i)segfault',
    "(?m)^WEB_BROWSER_TEST_FAILED(?:[: ].*)?$",
]
timeout = 1800
