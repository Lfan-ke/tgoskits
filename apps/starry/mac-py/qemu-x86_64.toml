args = [
    "-machine", "q35,accel=kvm:tcg",
    "-cpu", "max",
    "-nographic",
    "-m", "1024M",
    "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-x86_64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0",
    "-netdev", "user,id=net0",
]
uefi = true
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "/usr/bin/python3-mac /probe.py"
success_regex = ['(?m)^MAC-PY-PLATFORM (macOS|Darwin)-']
fail_regex = [
    '(?i)\bpanic(?:ked)?\b',
    '(?i)not (?:yet )?runnable',
    '(?i)invalid executable',
    '(?i)exec format error',
]
timeout = 600
